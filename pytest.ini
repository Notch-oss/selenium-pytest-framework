[pytest]
# Make project packages importable without installing the project.
pythonpath = .

testpaths = tests

addopts =
    -ra
    --strict-markers
    --html=reports/report.html
    --self-contained-html

markers =
    smoke: fast, high-value checks to run on every push
    regression: broader coverage run less frequently

# Live log output during the run.
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
